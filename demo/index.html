  <body>
    <main id="demo">
      <noscript>
        <h1>Vectrix</h1>
        <p>
          An oscillator, a fourteen-block guitar and eurorack pedalboard, and a
          cathode ray tube in X/Y mode, as an FFGL source and effect for
          Resolume and an OpenFX plugin for Resolve. What you're watching is
          where the beam actually went.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/vectrix">its repository</a>.
        </p>
        <ul>
